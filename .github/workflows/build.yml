name: Build watch face

on:
  push:
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate developer key
        run: |
          openssl genrsa -out key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in key.pem -out developer_key.der -nocrypt

      - name: Compile with Connect IQ SDK (Docker)
        run: |
          docker run --rm -v "$PWD:/src" -w /src --entrypoint /bin/bash \
            ghcr.io/matco/connectiq-tester:latest ./build.sh developer_key.der
          sudo chown -R "$(id -u):$(id -g)" dist

      - uses: actions/upload-artifact@v4
        with:
          name: GMT24H-prg
          path: dist/*.prg

      - name: Commit built files to dist/
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f dist/*.prg
          git commit -m "Build watch face .prg files [skip ci]" || exit 0
          git push
